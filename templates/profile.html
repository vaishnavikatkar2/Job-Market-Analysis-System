{% extends 'base.html' %}{% block title %}My profile{% endblock %}{% block content %}<div class="page-heading"><div class="eyebrow">ACCOUNT SETTINGS</div><h1>My profile</h1><p class="muted">Keep your details up to date for your job search.</p></div><div class="form-panel"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-3"><div class="col-md-6"><label class="form-label">Full name *</label><input class="form-control" name="name" value="{{ user.name }}" required maxlength="100"></div><div class="col-md-6"><label class="form-label">Email *</label><input class="form-control" type="email" name="email" value="{{ user.email }}" required></div><div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone" value="{{ user.phone }}" maxlength="30"></div><div class="col-md-6"><label class="form-label">Professional headline</label><input class="form-control" name="headline" value="{{ user.headline }}" maxlength="180" placeholder="e.g. BTech student | Python and SQL"></div><div class="col-12"><label class="form-label">Skills</label><input class="form-control" name="skills" value="{{ user.skills }}" placeholder="Python, SQL, Java"></div><div class="col-12"><label class="form-label">About me</label><textarea class="form-control" name="bio" rows="4" maxlength="4000">{{ user.bio }}</textarea></div></div><button class="btn btn-primary mt-4">Save profile</button></form></div>{% endblock %}
