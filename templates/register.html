{% extends 'base.html' %}{% block title %}Create account{% endblock %}{% block content %}<div class="auth-card auth-card-narrow mx-auto"><div class="eyebrow">GET STARTED</div><h2>Create your account</h2><p class="muted mb-4">Join to save jobs and track applications.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label">Full name</label><input class="form-control mb-3" name="name" maxlength="100" required><label class="form-label">Email address</label><input class="form-control mb-3" type="email" name="email" required><label class="form-label">Password</label><input class="form-control mb-1" type="password" name="password" minlength="10" required><div class="form-text mb-4">Use at least 10 characters.</div><button class="btn btn-primary btn-lg w-100">Create account</button></form><p class="text-center mt-4 mb-0 muted">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></div>{% endblock %}
